<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="text-scale" content="scale">
  <title>Casa · Contoh layar</title>
  <meta name="theme-color" content="#F4F4F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <script src="pengalih.js"></script>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="samples.css">
</head>
<body>
  <main class="halaman-indeks">
    <div class="kepala-isi">
      <h1 class="judul-layar">Contoh layar Casa</h1>
    </div>
    <p class="kecil">Semua nama dan angka di contoh ini rekaan. Tema dan kontras dapat dipilih tanpa mengubah setelan perangkat; Otomatis mengikuti setelan perangkat.</p>

    <form class="kartu" action="index.html" method="get">
      <fieldset class="segmen">
        <legend>Tema</legend>
        <div class="jalur">
            <label class="segmen-item"><input type="radio" name="tema" value="" checked><span class="ikon ikon-check" aria-hidden="true"></span>Otomatis</label>
            <label class="segmen-item"><input type="radio" name="tema" value="terang"><span class="ikon ikon-check" aria-hidden="true"></span>Terang</label>
            <label class="segmen-item"><input type="radio" name="tema" value="gelap"><span class="ikon ikon-check" aria-hidden="true"></span>Gelap</label>
        </div>
      </fieldset>
      <fieldset class="segmen">
        <legend>Kontras</legend>
        <div class="jalur">
            <label class="segmen-item"><input type="radio" name="kontras" value="" checked><span class="ikon ikon-check" aria-hidden="true"></span>Otomatis</label>
            <label class="segmen-item"><input type="radio" name="kontras" value="tinggi"><span class="ikon ikon-check" aria-hidden="true"></span>Tinggi</label>
        </div>
      </fieldset>
      <button type="submit" class="tombol tombol-biru">Pakai pilihan ini</button>
    </form>

    <section class="kartu" aria-labelledby="judul-layar-contoh">
      <h2 class="judul-bagian" id="judul-layar-contoh">Buka layar</h2>
      <ul>
          <li><a class="baris baris-tautan" href="beranda.html"><span class="lingkaran" aria-hidden="true"><span class="ikon ikon-house" aria-hidden="true"></span></span><span class="kata">Beranda</span><span class="ujung"><span class="ikon ikon-caret-right" aria-hidden="true"></span></span></a></li>
          <li><a class="baris baris-tautan" href="catat.html"><span class="lingkaran" aria-hidden="true"><span class="ikon ikon-plus" aria-hidden="true"></span></span><span class="kata">Catat</span><span class="ujung"><span class="ikon ikon-caret-right" aria-hidden="true"></span></span></a></li>
          <li><a class="baris baris-tautan" href="chat.html"><span class="lingkaran" aria-hidden="true"><span class="ikon ikon-chat-circle" aria-hidden="true"></span></span><span class="kata">Chat</span><span class="ujung"><span class="ikon ikon-caret-right" aria-hidden="true"></span></span></a></li>
      </ul>
    </section>
  </main>
</body>
</html>
