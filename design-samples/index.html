<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="text-scale" content="scale">
  <title>Casa · Contoh layar</title>
  <meta name="theme-color" content="#F4F4F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <script src="pengalih.js"></script>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="samples.css">
</head>
<body>
  <main class="halaman-indeks">
    <div>
      <h1 class="judul-layar">Contoh layar Casa</h1>
      <p class="kecil">Semua nama dan angka di contoh ini rekaan. Tema dan kontras dapat dipilih di bawah tanpa mengubah setelan perangkat.</p>
    </div>

    <form action="index.html" method="get">
      <fieldset>
        <legend>Tema</legend>
        <label class="pilihan"><input type="radio" name="tema" value="" checked>Ikuti perangkat</label>
        <label class="pilihan"><input type="radio" name="tema" value="terang">Terang</label>
        <label class="pilihan"><input type="radio" name="tema" value="gelap">Gelap</label>
      </fieldset>
      <fieldset>
        <legend>Kontras</legend>
        <label class="pilihan"><input type="radio" name="kontras" value="" checked>Ikuti perangkat</label>
        <label class="pilihan"><input type="radio" name="kontras" value="tinggi">Tinggi</label>
      </fieldset>
      <button type="submit" class="tombol tombol-utama">Pakai pilihan ini</button>
    </form>

    <section aria-labelledby="judul-layar-contoh">
      <h2 class="judul-bagian" id="judul-layar-contoh">Buka layar</h2>
      <ul class="daftar-layar">
        <li><a class="tombol tombol-garis" href="beranda.html">Beranda<span class="ikon ikon-lanjut" aria-hidden="true"></span></a></li>
        <li><a class="tombol tombol-garis" href="catat.html">Catat<span class="ikon ikon-lanjut" aria-hidden="true"></span></a></li>
        <li><a class="tombol tombol-garis" href="chat.html">Chat<span class="ikon ikon-lanjut" aria-hidden="true"></span></a></li>
      </ul>
    </section>
  </main>
</body>
</html>
