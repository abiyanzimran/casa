# Server merge gates (docs/14-engineering-roadmap.md §5.1: QG-01, QG-02,
# QG-03, QG-05) and the repository secrets check (09.4 §5). Every gate step
# calls one Makefile target, so CI and a local run cannot drift (ES §2, §7).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secrets check scans the whole history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25.0.5+8 # PMD CPD
      # Every gate runs even after another fails, so each one's result shows.
      - name: server-fmt (QG-01)
        if: ${{ !cancelled() }}
        run: make server-fmt
      - name: server-lint (QG-01)
        if: ${{ !cancelled() }}
        run: make server-lint
      - name: server-vuln (QG-03)
        if: ${{ !cancelled() }}
        run: make server-vuln
      - name: server-test (QG-05)
        if: ${{ !cancelled() }}
        run: make server-test
      - name: cpd-go (QG-02)
        if: ${{ !cancelled() }}
        run: make cpd-go
      - name: secrets
        if: ${{ !cancelled() }}
        run: make secrets
      # Coverage is reported, not gated (14 §4.13).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: server-coverage
          path: server/coverage.out
          if-no-files-found: warn
