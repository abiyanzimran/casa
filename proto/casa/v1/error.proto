syntax = "proto3";

package casa.v1;

// ErrorCode is the one domain error enum of the contract (ADR-013 item 4).
// A client acts on ErrorDetail.code, never on the Connect code alone. Names in
// the documents (session_expired, WRITE_FROZEN) become ERROR_CODE_<NAME> here,
// as buf lint requires. A task adds the codes it is the first to return.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // A write command from a client below the minimum version for its kind; the
  // command stays in the client's queue (ADR-028 item 5 and web note;
  // ADR-030 item 9; SEC-169 (d)).
  ERROR_CODE_CLIENT_UPGRADE_REQUIRED = 1;
  // The session ended by its idle or absolute limit (ADR-030 item 5;
  // SEC-161 (d)).
  ERROR_CODE_SESSION_EXPIRED = 2;
  // The session was revoked (ADR-030 item 5; SEC-172).
  ERROR_CODE_SESSION_REVOKED = 3;
  // The server is in write freeze; retryable, and the command stays queued
  // (ADR-028 item 3; 09.3 §1).
  ERROR_CODE_WRITE_FROZEN = 4;
  // The account has an unacknowledged notice version; retryable, and the
  // command stays queued (SEC-34; 09.3 §1).
  ERROR_CODE_NOTICE_UNREAD = 5;
  // A setup, verification or recovery token is missing, malformed, unknown,
  // expired, used, or bound to another email: one answer for every reason
  // (SEC-30; SEC-158).
  ERROR_CODE_TOKEN_REJECTED = 6;
  // Too many failed attempts from this account or network address; retry
  // later (SEC-12).
  ERROR_CODE_RATE_LIMITED = 7;
  // The email and password do not open a session, whichever of the two is
  // wrong (SEC-12).
  ERROR_CODE_CREDENTIALS_REJECTED = 8;
  // The server's serializable retries ran out under contention; the client
  // may send the same request again (09.2 §6).
  ERROR_CODE_RETRY_EXHAUSTED = 9;
  // The idempotency key was used before with another request; the client
  // must not resend it (09.2 §8).
  ERROR_CODE_IDEMPOTENCY_CONFLICT = 10;
  // The command needs a valid re-authentication of this session (SEC-13,
  // SEC-151 (7)).
  ERROR_CODE_REAUTH_REQUIRED = 11;
  // The account has not made the adult age statement of the current text
  // version; nothing was written (SEC-80; ADR-013 note 1.6).
  ERROR_CODE_AGE_DECLARATION_REQUIRED = 12;
  // The account may not create a household: it was made through an
  // invitation, or it is already a member of a household (SEC-158 (a);
  // FAM.md FR-FAM-001 AC-5, AC-10; ADR-013 note 1.6).
  ERROR_CODE_HOUSEHOLD_CREATION_NOT_ALLOWED = 13;
  // The object the command acts on is no longer in the state the client
  // saw, such as an acknowledgement of a notice version that is not the
  // latest; nothing was written, and no state is disclosed (10.1 §11 note
  // of 14 November 2026 (b); ADR-013 note 1.6).
  ERROR_CODE_STATE_CHANGED = 14;
  // The household already has an invitation that has not lapsed; nothing
  // was written (06 §3.6 F01; FR-FAM-003/AC-2; ADR-013 note 1.6).
  ERROR_CODE_INVITATION_PENDING = 15;
  // The household already has two full adult members, so it cannot invite
  // (06 §3.6 F01; FR-FAM-003/AC-5; ADR-013 note 1.6).
  ERROR_CODE_HOUSEHOLD_FULL = 16;
  // The account is already a member of a household, or a concurrent
  // command made it one (pilot server rule; 09.2 §5.1 note on decision 20;
  // ADR-013 note 1.6).
  ERROR_CODE_ALREADY_HOUSEHOLD_MEMBER = 17;
}

// ErrorDetail is the Connect error detail that carries the domain error code
// (ADR-013 item 4). Per-field validation errors carry buf.validate.Violations
// instead.
message ErrorDetail {
  ErrorCode code = 1;
}
