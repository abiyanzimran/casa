syntax = "proto3";

package casa.v1;

import "buf/validate/validate.proto";
import "casa/v1/command.proto";
import "casa/v1/request.proto";
import "google/protobuf/timestamp.proto";

// HouseholdService is the household module's API: households, memberships
// and invitations (09.2 §1; 06 §3.1, §3.6). Its errors are mapped by one
// function in the API layer (ADR-013 note 1.6).
service HouseholdService {
  // Creates a household with its creator as household owner, and the five
  // concepts of 06 §3.1 as separate rows (FAM.md FR-FAM-001). An
  // account-level command: its idempotency scope is the account (09.2 §8).
  // Refused with HOUSEHOLD_CREATION_NOT_ALLOWED for an account made through
  // an invitation or already a member (SEC-158 (a)), and with
  // AGE_DECLARATION_REQUIRED without the adult age statement (SEC-80).
  rpc CreateHousehold(CreateHouseholdRequest) returns (CreateHouseholdResponse) {
    option (casa.v1.command) = {hold_seconds: 0};
  }
  // Lists the caller's households with their members' display names, at
  // most 20 households of 20 members each [Usulan]. An online read, also
  // after sync exists (plan 1.6 decision 16).
  rpc ListMemberships(ListMembershipsRequest) returns (ListMembershipsResponse);
  // Returns the operator notice in force for the caller: its latest version,
  // with {pengelola} filled from the server's operator name, and whether the
  // caller acknowledged it (FR-FAM-019; SEC-34). The first read of a version
  // issues it to the account and writes one line in its security trail
  // (09.3 §1 "Mekanisme"). Never held by NOTICE_UNREAD.
  rpc GetOperatorNotice(GetOperatorNoticeRequest) returns (GetOperatorNoticeResponse);
  // Acknowledges the version the client showed, by variant, number and
  // text_sha256. Only the latest version releases the NOTICE_UNREAD hold;
  // any other is refused with STATE_CHANGED and nothing is written (SEC-34;
  // 10.1 §11 note of 14 November 2026 (b)). An online command outside the
  // queue, exempt from NOTICE_UNREAD (09.3 §1).
  rpc AcknowledgeOperatorNotice(AcknowledgeOperatorNoticeRequest) returns (AcknowledgeOperatorNoticeResponse) {
    option (casa.v1.command) = {
      hold_seconds: 0
      notice_exempt: true
    };
  }
  // Makes the household's one invitation, without a token, valid 7 days
  // from now (06 §3.6 F01; SEC-28). Only while the household has fewer than
  // two full adult members (HOUSEHOLD_FULL) and no live invitation
  // (INVITATION_PENDING); an invitation past its expiry is first recorded
  // as expired. household_id is a selector, checked against the caller's
  // memberships: another household answers as one that does not exist
  // (SEC-38 (a); FR-FAM-020).
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse) {
    option (casa.v1.command) = {hold_seconds: 0};
  }
  // Issues a new single-use link token for the caller's own open
  // invitation; the previous token stops working. The expiry stays the one
  // set at creation. Online only, outside the command kind table, and held
  // by NOTICE_UNREAD (10.1 SEC-28 note Q7). Any other caller gets NotFound;
  // an invitation that is no longer open gets STATE_CHANGED.
  rpc IssueInvitationLink(IssueInvitationLinkRequest) returns (IssueInvitationLinkResponse);
  // Cancels the caller's own open invitation (06 §3.6 F03). Any other caller
  // gets NotFound; an invitation that is no longer open gets STATE_CHANGED.
  rpc CancelInvitation(CancelInvitationRequest) returns (CancelInvitationResponse) {
    option (casa.v1.command) = {hold_seconds: 0};
  }
  // Shows the invitee, before accepting, the household's name and the
  // inviter's display name, and no other household data (FAM.md
  // FR-FAM-004/AC-1). A token that is not valid, past its expiry, used,
  // cancelled or replaced gets the one TOKEN_REJECTED answer of the
  // identity service, under the same token-use rate limit (SEC-30; 10.1 §10
  // note of 14 November 2026). Never writes; an online read, never held by
  // NOTICE_UNREAD (plan 1.6 decisions 7, 16).
  rpc PreviewInvitation(PreviewInvitationRequest) returns (PreviewInvitationResponse);
  // Accepts an invitation (06 §3.6 F02): the invitation waits for the
  // inviter to confirm the person (F04) and opens nothing of the household.
  // An account-level command (09.2 §8). Checked in this order, all before
  // the token is read: ALREADY_HOUSEHOLD_MEMBER for an account that is a
  // member anywhere or has a live acceptance of its own, then
  // AGE_DECLARATION_REQUIRED (SEC-32, SEC-38 (c), SEC-80); then every
  // token or invitation failure, a full household included, is the one
  // TOKEN_REJECTED (SEC-30).
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {
    option (casa.v1.command) = {hold_seconds: 0};
  }
  // Withdraws the caller's own acceptance (06 §3.6 F05): the server finds it
  // from the caller's account, never from the request (plan 1.6 decision
  // 14). NotFound without one; STATE_CHANGED for one past its expiry, which
  // is recorded as expired first. Protective, so never held (lead ruling;
  // SEC-151 (1)).
  rpc WithdrawAcceptance(WithdrawAcceptanceRequest) returns (WithdrawAcceptanceResponse) {
    option (casa.v1.command) = {
      hold_seconds: 0
      protective: true
      notice_exempt: true
    };
  }
  // Confirms that the person who accepted the caller's own invitation is the
  // one invited (06 §3.6 F04; FR-FAM-004/AC-4): the invitee becomes a
  // household owner with the role, permission set and approval authority of
  // the inviter. Only the inviter, only an accepted invitation before its
  // expiry: any other caller gets NotFound; another state, an expired
  // acceptance (recorded as expired first), a household that already has
  // two full adult members (06 §3.6), or an invitee who is no longer
  // available gets STATE_CHANGED (09.2 §5.1, note on decision 20).
  rpc ConfirmInvitee(ConfirmInviteeRequest) returns (ConfirmInviteeResponse) {
    option (casa.v1.command) = {hold_seconds: 0};
  }
  // Says the person who accepted the caller's own invitation is not the one
  // invited (06 §3.6 F05 reject_invitee; FR-FAM-004/AC-3): the invitation
  // lapses and the inviter can invite again. Callers and answers as
  // ConfirmInvitee.
  rpc RejectInvitee(RejectInviteeRequest) returns (RejectInviteeResponse) {
    option (casa.v1.command) = {hold_seconds: 0};
  }
  // Returns the household's live invitation, if any: its id, state and
  // expiry. The invitee's display name and verified email are filled only
  // for the inviter of an accepted invitation, so the inviter can tell the
  // person apart before F04 (FR-FAM-004/AC-2; SEC-31). Empty when there is
  // none or it is past its expiry. Never writes; an online read, never held
  // by NOTICE_UNREAD (plan 1.6 decision 16).
  rpc GetOpenInvitation(GetOpenInvitationRequest) returns (GetOpenInvitationResponse);
}

message CreateHouseholdRequest {
  RequestContext request_context = 1 [(buf.validate.field).required = true];
  // The bounds here are coarse; the server counts visible characters after
  // NFC (1 to 60) and refuses the SEC-155 (h) character classes, with the
  // rule ids name.visible_length and name.characters (FAM.md FR-FAM-001
  // note of 14 November 2026).
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // An IANA time zone name; another is refused with time_zone.iana (06
  // §2.4).
  string time_zone = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // The creator's display name (FR-FAM-006), 1 to 40 visible characters,
  // checked as name.
  string display_name = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // The version of the adult age statement shown (08 §7.1; SEC-80); 0 when
  // none was shown, which only an account that made it before may send.
  uint32 age_declaration_version = 5;
}

message CreateHouseholdResponse {
  string household_id = 1;
  string member_id = 2;
}

message ListMembershipsRequest {
  RequestContext request_context = 1 [(buf.validate.field).required = true];
}

// Membership is one household of the caller: its own member id and the
// household's members.
message Membership {
  string household_id = 1;
  string household_name = 2;
  string member_id = 3;
  repeated Member members = 4;
}

// Member is a member as other members see it: no email, no account id.
message Member {
  string member_id = 1;
  string display_name = 2;
}

message ListMembershipsResponse {
  repeated Membership memberships = 1;
}

message GetOperatorNoticeRequest {
  RequestContext request_context = 1 [(buf.validate.field).required = true];
}

// NoticeParagraph is one paragraph of a notice version, as plain text.
message NoticeParagraph {
  string text = 1;
  // "" for a paragraph that always applies; else the feature it describes,
  // and the client shows "Berlaku saat fitur ini tersedia" above it when its
  // build lacks that feature (SEC-34 (5); 08 §7.5).
  string feature = 2;
}

message GetOperatorNoticeResponse {
  // couple, family or general (SEC-34; 10.1 §11.3, §11.3.1).
  string variant = 1;
  uint32 version = 2;
  string title = 3;
  repeated NoticeParagraph paragraphs = 4;
  // True when the caller acknowledged this version (FR-FAM-019/AC-2).
  bool acknowledged = 5;
  // The version's identity for the account: SHA-256 of the filled text
  // (10.1 §11 note of 14 November 2026 (a)); the acknowledgement sends it
  // back.
  bytes text_sha256 = 6;
}

message AcknowledgeOperatorNoticeRequest {
  RequestContext request_context = 1 [(buf.validate.field).required = true];
  string variant = 2 [(buf.validate.field).string = {
    in: [
      "couple",
      "family",
      "general"
    ]
  }];
  // At most the largest int32, so the server's int32 never overflows (plan
  // 1.6 decision 6).
  uint32 version = 3 [(buf.validate.field).uint32 = {
    gt: 0
    lte: 2147483647
  }];
  bytes text_sha256 = 4 [(buf.validate.field).bytes.len = 32];
}

message AcknowledgeOperatorNoticeResponse {}

message CreateInvitationRequest {
  RequestContext request_context = 1 [(buf.validate.field).required = true];
  string household_id = 2 [(buf.validate.field).string.uuid = true];
}

message CreateInvitationResponse {
  string invitation_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message IssueInvitationLinkRequest {
  RequestContext request_context = 1 [(buf.validate.field).required = true];
  string household_id = 2 [(buf.validate.field).string.uuid = true];
  string invitation_id = 3 [(buf.validate.field).string.uuid = true];
}

// The token and its expiry only: nothing about the household (FR-FAM-003/AC-6;
// SEC-29). The answer carries Cache-Control: no-store and the client never
// stores the token (SEC-28 note Q7 (d)).
message IssueInvitationLinkResponse {
  // 43 characters of unpadded base64url; the link is <origin>/invite#<token>.
  string invitation_token = 1 [debug_redact = true];
  google.protobuf.Timestamp expires_at = 2;
}

message CancelInvitationRequest {
  RequestContext request_context = 1 [(buf.validate.field).required = true];
  string household_id = 2 [(buf.validate.field).string.uuid = true];
  string invitation_id = 3 [(buf.validate.field).string.uuid = true];
}

message CancelInvitationResponse {}

// InvitationSource is where the invitation comes from: the token of a pasted
// link, or the invitation the caller's account signed up through (FAM.md
// FR-FAM-004/AC-14; built with sign-up through an invitation). No rule: an
// invalid token gets the one TOKEN_REJECTED, never a validation error
// (SEC-30).
message InvitationSource {
  oneof source {
    string invitation_token = 1 [debug_redact = true];
    bool from_signup = 2;
  }
}

message PreviewInvitationRequest {
  RequestContext request_context = 1 [(buf.validate.field).required = true];
  InvitationSource source = 2;
}

// Only the names the invitee reads before accepting: no money data, no
// member list (FR-FAM-004/AC-1).
message PreviewInvitationResponse {
  string household_name = 1;
  string inviter_display_name = 2;
  // True when the caller is a former member of the household (FR-FAM-004
  // AC-10, AC-11); always false until members can leave (step 6).
  bool former_member_notice = 3;
}

message AcceptInvitationRequest {
  RequestContext request_context = 1 [(buf.validate.field).required = true];
  InvitationSource source = 2;
  // The invitee's display name (FR-FAM-006), 1 to 40 visible characters,
  // checked as CreateHouseholdRequest.display_name.
  string display_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // The version of the adult age statement shown (08 §7.1; SEC-80), as in
  // CreateHouseholdRequest.
  uint32 age_declaration_version = 4;
}

message AcceptInvitationResponse {
  string household_id = 1;
  string invitation_id = 2;
}

// No household_id: the server finds the caller's acceptance (plan 1.6
// decision 14).
message WithdrawAcceptanceRequest {
  RequestContext request_context = 1 [(buf.validate.field).required = true];
}

message WithdrawAcceptanceResponse {}

message ConfirmInviteeRequest {
  RequestContext request_context = 1 [(buf.validate.field).required = true];
  string household_id = 2 [(buf.validate.field).string.uuid = true];
  string invitation_id = 3 [(buf.validate.field).string.uuid = true];
}

message ConfirmInviteeResponse {
  // The new member's id in the household.
  string member_id = 1;
}

message RejectInviteeRequest {
  RequestContext request_context = 1 [(buf.validate.field).required = true];
  string household_id = 2 [(buf.validate.field).string.uuid = true];
  string invitation_id = 3 [(buf.validate.field).string.uuid = true];
}

message RejectInviteeResponse {}

message GetOpenInvitationRequest {
  RequestContext request_context = 1 [(buf.validate.field).required = true];
  string household_id = 2 [(buf.validate.field).string.uuid = true];
}

// InvitationState is a live invitation's state (06 §3.6): open is
// undangan_terbuka, accepted is menunggu_konfirmasi_pengundang.
enum InvitationState {
  INVITATION_STATE_UNSPECIFIED = 0;
  INVITATION_STATE_OPEN = 1;
  INVITATION_STATE_ACCEPTED = 2;
}

// Empty when the household has no live invitation.
message GetOpenInvitationResponse {
  string invitation_id = 1;
  InvitationState state = 2;
  google.protobuf.Timestamp expires_at = 3;
  // Only for the inviter of an accepted invitation (FR-FAM-004/AC-2).
  string invitee_display_name = 4;
  // The invitee's verified email, whole, only for the inviter of an
  // accepted invitation (SEC-31); read online only, never stored as
  // household data.
  string invitee_email = 5 [debug_redact = true];
}

// Household is the household object of sync (plan 1.7 decision 7).
message Household {
  string household_id = 1;
  string name = 2;
  // An IANA time zone name (06 §2.4).
  string time_zone = 3;
  // ISO 4217 code of the household's currency.
  string currency = 4;
}

// Invitation is the live invitation object of sync: its state only. The
// invitee's display name and email never travel in sync; the inviter reads
// them online through GetOpenInvitation (plan 1.6 Q12; SEC-31).
message Invitation {
  string invitation_id = 1;
  InvitationState state = 2;
  google.protobuf.Timestamp expires_at = 3;
  string inviter_member_id = 4;
}
