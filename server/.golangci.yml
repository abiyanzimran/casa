# golangci-lint v2 configuration (QG-01; ADR-025 item 1).
version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - nolintlint
  settings:
    nolintlint:
      # ES §1: a suppression needs a comment giving the reason.
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
